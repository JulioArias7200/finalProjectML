<!-- =========================================================================
     SIDEBAR IZQUIERDO: NAVEGACIÓN EN 6 GRUPOS PRINCIPALES
     ========================================================================= -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="#" class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </div>
      <div class="brand-text">
        <h1>SupervisadoML</h1>
        <span>EAIMCS · INE Bolivia</span>
      </div>
    </a>
    <button class="sidebar-toggle-btn" id="sidebarToggle" title="Colapsar menú lateral">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
    </button>
  </div>

  <!-- Menú Reestructurado en 6 Grupos -->
  <ul class="sidebar-menu">
    <li class="sidebar-group-header">1. Panorama General</li>
    <li>
      <button class="nav-item-btn active" data-section="panorama">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-text">Panorama General</span>
      </button>
    </li>

    <li class="sidebar-group-header">2. Operaciones & Auditoría</li>
    <li>
      <button class="nav-item-btn" data-section="riesgo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span class="nav-text">Empresas & Riesgo</span>
      </button>
    </li>

    <li class="sidebar-group-header">3. Modelos & Inferencia</li>
    <li>
      <button class="nav-item-btn" data-section="modelo_validez">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span class="nav-text">Modelo & Validez</span>
      </button>
    </li>

    <li class="sidebar-group-header">4. Monitoreo & MLOps</li>
    <li>
      <button class="nav-item-btn" data-section="monitoreo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="nav-text">Monitoreo & Seguridad</span>
      </button>
    </li>

    <li class="sidebar-group-header">5. Metodología & Gobernanza</li>
    <li>
      <button class="nav-item-btn" data-section="gobernanza">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span class="nav-text">Metodología & Gobernanza</span>
      </button>
    </li>

    <li class="sidebar-group-header">6. Auditoría & Bitácora</li>
    <li>
      <button class="nav-item-btn" data-section="bitacora_analisis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="nav-text">Bitácora de Análisis</span>
      </button>
    </li>
  </ul>

  <!-- Footer Sidebar con Versión de Modelo -->
  <div class="sidebar-footer">
    <div class="model-badge-card">
      <span class="badge-title">Modelo Campeón Activo</span>
      <span class="badge-val" id="sidebarModelBadge">{{ active_version }}</span>
    </div>
  </div>
</aside>
